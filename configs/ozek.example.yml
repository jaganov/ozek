# Ozek get-started config (safe to commit — Hub model ids only).
#
# Personal overrides (gitignored — copy then edit):
#   cp configs/ozek.example.yml ozek.yml
#   # or: cp configs/ozek.example.yml ozek.local.yml
#
# Search order: --config → $OZEK_CONFIG → ./ozek.local.yml → ./ozek.yml
#               → ~/.config/ozek/ozek.yml → this example (bundled fallback)
#
# Usage:
#   ozek generate --prompt "Hi"
#   ozek run summarize --prompt "..."
#   ozek-server

default_profile: qwen25-3b-4bit

# Soft KV/RAM guard for ~16 GB unified memory (not the model context window).
max_context_tokens: 4096

server:
  host: 127.0.0.1
  port: 8787

presets:
  summarize:
    system: >
      Summarize the user's text. Reply with JSON only.
      Fill the fields; never echo the schema itself.
    max_tokens: 256
    temperature: 0.2
    response_format: json
    json_retries: 1
    timeout_s: 60
    schema:
      type: object
      properties:
        summary:
          type: string
        bullets:
          type: array
          items:
            type: string
      required: [summary, bullets]

  draft:
    temperature: 0.7
    max_tokens: 512

  short:
    max_tokens: 64
    temperature: 0.0
    stop: ["\n\n"]
